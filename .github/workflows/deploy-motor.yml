name: Deploy motor to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/motor-agente/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-motor.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ivannsotoo20/setters-ia/motor-agente

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: sha-${SHORT_SHA}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/motor-agente/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker-compose.dev.yml,scripts/rollback.sh"
          target: "/opt/fyzon"
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/fyzon
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            # Persistir el tag en .env.local (symlink .env, de donde compose
            # interpola ${IMAGE_TAG} en los arranques MANUALES). Sin esto, un
            # `docker compose up -d` a mano resolvía `latest` y retrocedía el
            # motor a una imagen vieja en silencio — pasó el 2026-08-25: el
            # flip a enforce del webhook reinició con la imagen de la víspera
            # y los webhooks reales de GHL rebotaron con 401.
            if grep -q '^IMAGE_TAG=' .env.local; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.local
            else
              printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env.local
            fi
            echo "Pulling motor image ${IMAGE_TAG}..."
            docker compose pull motor
            echo "Starting motor + redis + cloudflared..."
            docker compose up -d
            echo "Pruning old images (>7 days)..."
            docker image prune -f --filter "until=168h" || true
            echo "Container status:"
            docker compose ps

      - name: Smoke check /health
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://setter.fyzon.es/health; then
              echo ""
              echo "✅ Health OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "❌ ERROR: motor /health did not return 200 after 5 attempts"
          exit 1
