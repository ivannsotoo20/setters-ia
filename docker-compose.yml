services:
  redis:
    image: redis:7-alpine
    container_name: fyzon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  motor:
    build:
      context: .
      dockerfile: apps/motor-agente/Dockerfile
    container_name: fyzon-motor
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  redis-data:
