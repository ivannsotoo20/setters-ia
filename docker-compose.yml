services:
  redis:
    image: redis:7-alpine
    container_name: fyzon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  motor:
    image: ghcr.io/ivannsotoo20/setters-ia/motor-agente:${IMAGE_TAG:-latest}
    container_name: fyzon-motor
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fyzon-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      motor:
        condition: service_started

volumes:
  redis-data:
